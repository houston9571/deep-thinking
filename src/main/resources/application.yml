################ spring boot config ###############
server:
  port: 80
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: deep-thinking
  mvc:
    view:
      prefix: /
      suffix: .html
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 16         # 最大连接数
          max-idle: 8            # 最大空闲连接
          min-idle: 1            # 最小空闲连接
          time-between-eviction-runs: 100ms # 空闲连接回收间隔

jetcache:
  statIntervalMinutes: 60         # 统计信息输出间隔，0表示不输出
  areaInCacheName: false          # 是否将area名称加入缓存key前缀
  local:
    default:
      type: caffeine              # 本地缓存类型：caffeine/linkedhashmap
      limit: 100                  # 本地缓存最大元素数量
      keyConvertor: fastjson2     # key转换器，建议使用fastjson2
      expireAfterWriteInMillis: 180000    # 本地缓存默认过期时间（毫秒）
  remote:
    default:
      type: redis
      keyConvertor: fastjson2
      valueEncoder: kryo5                 # 远程缓存值序列化方式：java/kryo/kryo5  kryo5 性能优于 JDK 序列化
      valueDecoder: kryo5
      expireAfterWriteInMillis: 3600000   # 1小时后远程缓存失效，单位毫秒
      host: ${spring.data.redis.host}     # Redis连接配置（继承spring.redis.*，也可单独覆盖）
      port: ${spring.data.redis.port}
      database: ${spring.data.redis.database}
      poolConfig:
        minIdle: 1
        maxIdle: 20
        maxTotal: 50

#====== config dev =======#
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    name: quant
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://127.0.0.1:3306/quant?rewriteBatchedStatements=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&connectTimeout=60000&socketTimeout=60000
    username: root
    password: 88888888
    hikari:
      pool-name: DatebookHikariCP
      auto-commit: true
      maximum-pool-size: 50
      minimum-idle: 5
      idle-timeout: 600000                  # 10分钟, 空闲连接的最大存活时间（毫秒），超过该时间且未被使用则被回收, 只对超过 minimum-idle 的空闲连接生效
      connection-timeout: 30000             # 连接的超时时间（毫秒），即从连接池获取连接的等待时间
      max-lifetime: 1800000                 # 30分钟（应小于数据库的 wait_timeout） 连接的最大生命周期（毫秒），无论是否空闲，到达时间后强制关闭
      keepalive-time: 60000                # 5分钟（HikariCP 2.6+ 支持，用于保持连接活跃）, 空闲连接测试的间隔
      connection-test-query: SELECT 1       # 连接池将向数据库发送一个测试查询以验证连接是否有效
      validation-timeout: 5000              # 测试连接的超时时间, 从连接池获取连接时是否测试连接有效性（性能影响，生产建议设为 true）
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  config: classpath:log4j2-dev.xml
  level:
    com.zaxxer.hikari: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
forest:
  backend: okhttp3             # 后端HTTP框架 okhttp3 httpclient
  max-connections: 5000        # 连接池最大连接数（默认为 500）
  max-route-connections: 500   # 每个路由的最大连接数（默认为 500）
  max-request-queue-size: 100  # 最大请求等待队列大小
  max-async-thread-size: 300   # 最大异步线程数
  max-async-queue-size: 16     # 最大异步线程池队列大小
  connect-timeout: 20000       # 连接超时时间，单位为毫秒（默认为 timeout）
  read-timeout: 20000          # 数据读取超时时间，单位为毫秒（默认为 timeout）
  max-retry-count: 2           # 请求失败后重试次数（默认为 0 次不重试）
  ssl-protocol: TLS            # 单向验证的HTTPS的默认TLS协议（默认为 TLS）
  log-enabled: true            # 打开或关闭日志（默认为 true）
  log-request: true            # 打开/关闭Forest请求日志（默认为 true）
  log-response-status: true    # 打开/关闭Forest响应状态日志（默认为 true）
  log-response-content: true   # 打开/关闭Forest响应内容日志（默认为 false）
  async-mode: platform         # 异步模式（默认为 platform）
  success-when: com.deepthinking.ext.base.ForestSuccessCondition
  log-handler: com.deepthinking.ext.base.ForestLogHandler
  interceptors: com.deepthinking.ext.interceptor.ForestHttpInterceptor

